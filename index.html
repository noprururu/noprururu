<!DOCTYPE html>
<html lang="ja">
<head>
    <title>Himari Meimei VS Succubus Shoot 'Em Up Game Game</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="冥鳴ひまり VS サキュバスが戦う弾幕シューティングゲームです。大量の弾幕を避け、お金を集め、装備をアップグレードしながら戦いましょう。" />


    <style>
                body {
                    margin: 0;
                    background: #050505;
                    overflow: hidden;
                    display: flex;
                    justify-content: center;
                    /*上下のセンター配置*/
                    align-items: center;
                    width: 100vw;
                    height: 100vh;
                }


                /* 上揃え
        align-items:flex-start;*/
                /* 下揃え
        align-items:flex-end;*/
                /* 下の余白を空ける
        padding-bottom:20px;
        box-sizing:border-box;*/
                /* 上の余白を空ける
        padding-top:20px;
        box-sizing:border-box;*/

                /*#3F2E5F*/
                canvas {
                    display: block;
                    background: #0A090F;
                    width: 100vw;
                    height: 100vh;
                    object-fit: contain;
                }
    </style>
</head>

<body>
    <canvas id="game" width="1280" height="720"></canvas>

    <script>
    ////////////////////////////////////////////////////////////
    // Canvas
    ////////////////////////////////////////////////////////////
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    </script>

    <script src="setupdata.js"></script>
    <script src="soundset.js"></script>
    <script src="input.js"></script>
    <script src="langsconfig.js"></script>
    <script src="process.js"></script>
    <script src="drawtop.js"></script>
    <script src="mobtalk.js"></script>
    <script src="configprocess.js"></script>
    <script src="drawconfig.js"></script>
    <script src="draw.js"></script>

    <script>
    //拡大を防ぐ処理なんだけど、これを使うとクロムが動かなくなる
    //<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

        // スクロール位置
        let c = 0;

        // スクロール速度
        let speed = 1;

        //タイマー 戦闘用 音楽用
        let timer = 0;
        //タイマー リセット用
        let timerf = 0;

        // ゲーム内部解像度
        const GAME_WIDTH = 1280;
        const GAME_HEIGHT = 720;


        ///////////////////////////////////////////////////////////////////////
        // 全画面化
        ///////////////////////////////////////////////////////////////////////
        function resize() {

            if (fulldisplayf == 1) {

                const ww = window.innerWidth;
                const wh = window.innerHeight;

                const scale = Math.min(
                    ww / GAME_WIDTH,
                    wh / GAME_HEIGHT
                );

                canvas.style.width = GAME_WIDTH * scale + "px";
                canvas.style.height = GAME_HEIGHT * scale + "px";

            } else {

                // 元のサイズに戻す
                canvas.style.width = GAME_WIDTH + "px";
                canvas.style.height = GAME_HEIGHT + "px";

            }

            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;

        }

        //削除用
        localStorage.removeItem("inputConfig");
        localStorage.removeItem("inputPadConfig");


        if (Object.keys(inputConfig).length === 0) {
            // 空なのでデータを作り、JSONは読み込まない
            inputConfig = updateinputn0();
            inputn = 0;

        } else {
            // 中身があるので読み込む
            inputConfig = JSON.parse(localStorage.getItem("inputConfig"));


        }

        if (inputPadConfig.length === 0) {
            // 空なのでデータを作り、JSONをいったんセーブする。読み込みはしない
            inputPadConfig = [12, 15, 13, 14, 0, 1, 3, 2, 4, 9, 8, 5];
            localStorage.setItem("inputPadConfig", JSON.stringify(inputPadConfig));

        } else {
            // 中身があるので読み込む
            inputPadConfig = JSON.parse(localStorage.getItem("inputPadConfig"));

        }





        ////////////////////////////////////////////////////////////
        // Canvas
        ////////////////////////////////////////////////////////////
        //最初はmobilefでスマホを識別した後
        //navigator.maxTouchPoints > 0でノートPCタッチ操作の可能性を残す
        //最後にゲームパッドの識別をする

        /*
        //スマホ識別用 スマホなら1 , tapできるlaptopも1
        let spf = 0;
        //PC 識別用 PCなら1
        let pcf = 1;
        */

        // モバイルかどうかの確認
        const mobilef =
            /Android|iPhone|iPad|iPod|Kindle|Silk|BlackBerry|BB10|PlayBook|IEMobile|Windows Phone|webOS|Opera Mini|Opera Mobi|Mobile/i
                .test(navigator.userAgent)
            || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

        if (mobilef) {
            spf = 1;
            pcf = 0;
            fulldisplayf = 1
            resize();

            }



        //let lang = navigator.language.toLowerCase();//2文字で小文字取得
        let lang = navigator.language.toLowerCase().slice(0, 2);
        const locale = navigator.language.toLowerCase();//5文字以上で小文字取得
        let fontFamily = "sans-serif";

        //デバッグ用
        //lang = "en";

        for (let i = 0; i < 34; i++) {
            //if(lang.startsWith(langs[i])){//言語がフィットした時
            if (lang === langs[i]) {//言語がフィットした時
                if (lang.startsWith("zh")) {
                    if (locale === "zh-cn" || locale === "zh-sg" || locale === "zh-hans") fontFamily = notos[3], mylangn = 3;
                    else if (locale === "zh-tw" || locale === "zh-HK" || locale === "zh-mo" || locale === "zh-hant") fontFamily = notos[4], mylangn = 4;
                    else fontFamily = notos[3], mylangn = 3;

                }

                else fontFamily = notos[i], mylangn = i;
                break; //マッチしたらループを抜ける

            }

        }



        // 最後にCSSを適用する処理（これがないと画面のフォントが変わりません）
        document.body.style.fontFamily = `'${fontFamily}', sans-serif`;
        // Google Fontsから動的に読み込み
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = `https://fonts.googleapis.com/css2?family=${fontFamily.replace(/ /g, "+")}:wght@400;700&display=swap`;
        link.onload = () => {
            document.fonts.ready.then(assetLoaded);

        };

        link.onerror = () => {
            assetLoaded(); // sans-serifで描画

        };

        document.head.appendChild(link);


        ////////////////////////////////////////////////////////////
        // コメント一文字用
        ////////////////////////////////////////////////////////////
        let displayoneText = "";
        let charIndex = 0;
        let onelettertext = ``;
        let oneletterc = 0;
        let oneflame = 0;






        ////////////////////////////////////////////////////////////
        // ロードする画像
        ////////////////////////////////////////////////////////////
        const imageList = {
            chara: "image/chara.png",
            bgeff: "image/backeffect.png",
            iconplay: "image/iconplay.png",
            iconpause: "image/iconpause.png",
            iconvolon: "image/iconvolon.png",
            iconvoloff: "image/iconvoloff.png",
            iconsetting: "image/iconsetting.png",
            topfrill: "image/topfrill.png",
            stagechoucho: "image/stagechoucho.png",
            resultbg: "image/resultbg.png",
            barrier: "image/barrier.png",
            touch0: "image/touch0.png"

        };

        //死亡リスタート演出
        for (let i = 0; i < 2; i++) {
            imageList["restart" + i] = "image/restart" + i + ".png";

        }


        //アイテムショップ
        for (let i = 0; i < 2; i++) {
            imageList["itemshop" + i] = "image/itemshop" + i + ".png";

        }

        //青花火
        for (let i = 0; i < 14; i++) {
            imageList["bluehanabi" + i] = "image/bluehanabi" + i + ".png";

        }

        //インナーフラワー
        for (let i = 0; i < 2; i++) {
            imageList["innerflower" + i] = "image/innerflower" + i + ".png";// 0左 1右

        }

        //アイコンハート
        for (let i = 0; i < 2; i++) {
            imageList["iconlife" + i] = "image/iconlife" + i + ".png";// 0ハート黒 1ハートピンク

        }

        //顔
        for (let i = 0; i < 4; i++) {
            imageList["kao" + i] = "image/kao" + i + ".png";

        }

        //モンスター画像
        for (let i = 0; i < 162; i++) {
            imageList["mob" + i] = "image/mob" + i + ".png";

        }

        //ちょうちょ画像
        for (let i = 0; i < 8; i++) {
            imageList["choucho" + i] = "image/choucho8080" + i + ".png";

        }

        //コイン画像
        for (let i = 0; i < 12; i++) {
            imageList["coinimg" + i] = "image/coin" + i + ".png";

        }

        //背景
        for (let i = 0; i < 20; i++) {
            imageList["bg" + i] = "image/ny" + i + ".png";
        }

        //雲
        for (let i = 0; i < 6; i++) {
            imageList["cloud" + i] = "image/cloud" + i + ".png";
        }


        //キャラ画像
        for (let i = 0; i < 19; i++) {
            imageList["chara" + i] = "image/chara" + i + ".png";
        }

        //クラッシュハート
        for (let i = 0; i < 15; i++) {
            imageList["crashheart" + i] = "image/crashheartanime" + i + ".png";

        }

        //Smart Phone Ball
        for (let i = 0; i < 4; i++) {
            imageList["ball" + i] = "image/ball" + i + ".png";

        }

        //Grenade
        for (let i = 0; i < 3; i++) {
            imageList["grenade" + i] = "image/grenade" + i + ".png";

        }

        //Grenade hanabi
        for (let i = 0; i < 8; i++) {
            imageList["grenadehanabi" + i] = "image/grenadehanabi" + i + ".png";

        }

        //Bazooka
        for (let i = 0; i < 5; i++) {
            imageList["bazooka" + i] = "image/bazooka" + i + ".png";

        }

        //Bazooka hanabi
        for (let i = 0; i < 7; i++) {
            imageList["bazookahanabi" + i] = "image/bazookahanabi" + i + ".png";

        }

        //Bom
        for (let i = 0; i < 4; i++) {
            imageList["bomimg" + i] = "image/bom" + i + ".png";

        }

        //吹き出し
        for (let i = 0; i < 2; i++) {
            imageList["hukidasi" + i] = "image/hukidasi" + i + ".png";

        }

        ////////////////////////////////////////////////////////////
        // ロードする音
        ////////////////////////////////////////////////////////////
        const audioList = {
            voice0: "sound/voice_loading.mp3",
            voice1: "sound/voice_title.mp3",
            voice2: "sound/voice_kyouwa.mp3",
            voice3: "sound/voice_qwer.mp3",
            voice4: "sound/voice_wasd.mp3",
            voice5: "sound/voice_juji.mp3",
            voice6: "sound/voice_gamepad.mp3",
            voice7: "sound/voice_soredeha.mp3",
            voice8: "sound/voice_q.mp3",
            voice9: "sound/voice_w.mp3",
            voice10: "sound/voice_e.mp3",
            voice11: "sound/voice_r.mp3",
            voice12: "sound/voice_kati.mp3",
            voice13: "sound/voice_mairi.mp3",
            voice14: "sound/voice_otukare.mp3",
            voice15: "sound/voice_tuduke.mp3",
            voice16: "sound/voice_soundtest.mp3",
            voice17: "sound/voice_irasshai.mp3",
            voice18: "sound/voice_arigato.mp3",

            bgm0: "sound/universe.mp3",
            bgm1: "sound/1minute.mp3",
            bgm2: "sound/maou_bgm_neorock67.mp3",
            bgm3: "sound/maou_bgm_neorock72.mp3",
            bgm4: "sound/maou_bgm_neorock68.mp3",

            sound0: "sound/smg.mp3",
            sound1: "sound/grenade1.mp3",
            sound2: "sound/barrier.mp3",
            sound3: "sound/ak.mp3",
            sound4: "sound/bazooka1.mp3",
            sound5: "sound/bazooka2.mp3",
            sound6: "sound/bom.mp3",
            sound7: "sound/helicopter.mp3",
            sound8: "sound/coin.mp3",
            sound9: "sound/bottle.mp3",
            sound10: "sound/maou_se_battle18.mp3",
            sound11: "sound/score.mp3",
            sound12: "sound/onehanabi.mp3",
            sound13: "sound/beep.mp3",   //NG
            sound14: "sound/click.mp3",   //OK
            sound15: "sound/grenade2.mp3"
        };

        ////////////////////////////////////////////////////////////
        // 保存用
        ////////////////////////////////////////////////////////////
        const images = {};
        const audios = {};

        ////////////////////////////////////////////////////////////
        // カウント
        ////////////////////////////////////////////////////////////
        let totalAssets = 0;
        let loadedAssets = 0;

        ////////////////////////////////////////////////////////////
        // 合計数計算
        ////////////////////////////////////////////////////////////
        totalAssets =
            Object.keys(imageList).length +
            Object.keys(audioList).length;


        ////////////////////////////////////////////////////////////
        // 画像ロード
        ////////////////////////////////////////////////////////////
        for (let key in imageList) {

            const img = new Image();

            img.onload = () => {
                assetLoaded();

            };

            img.src = imageList[key];

            images[key] = img;

        }

        ////////////////////////////////////////////////////////////
        // 音ロード
        ////////////////////////////////////////////////////////////
        for (let key in audioList) {

            const audio = new Audio();

            audio.addEventListener("loadeddata", assetLoaded, { once: true });

            audio.src = audioList[key];
            audio.load();

            audios[key] = audio;

        }

        ////////////////////////////////////////////////////////////
        // ロード中
        ////////////////////////////////////////////////////////////
        function drawLoading() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#EDEFF2";
            ctx.textAlign = "center";
            const percent = Math.floor((loadedAssets / totalAssets) * 100);

            //pxの後スペースが必要
            ctx.textBaseline = "middle";
            ctx.font = "bold 50px " + fontFamily;
            ctx.fillText(configtext[mylangn].title1, 640, 195);

            ctx.font = "bold 40px " + fontFamily;
            ctx.fillText(configtext[mylangn].title2, 640, 270);

            ctx.font = "bold 40px " + fontFamily;
            ctx.fillText("LOADING " + percent + "%", 640, 350);

            if (loadedAssets >= totalAssets) {
                ctx.font = "bold 36px " + fontFamily;
                ctx.fillStyle = "#6E3B5E";
                ctx.fillText("* Press any key *", 640, 460);

            }


            // 15フレームごとに1文字追加
            if (oneletterc == oneflame) {
                onelettertext = configtext[mylangn].loading;
                charIndex = 0;
                displayoneText = "";

            }

            if (oneletterc < oneflame + 200) {
                onelettertext = configtext[mylangn].loading;
                ctx.fillStyle = "#EDEFF2";
                ctx.font = "28px " + fontFamily;
                if (charIndex < onelettertext.length && oneflame % 15 == 0) {
                    displayoneText += onelettertext[charIndex];
                    charIndex++;

                }

                ctx.fillText(displayoneText, 640, 620);

                oneflame++;



            }

        }//drawLoading();


        ////////////////////////////////////////////////////////////
        // ロード完了チェック
        ////////////////////////////////////////////////////////////
        function assetLoaded() {
            if (loadedAssets < totalAssets) {
                loadedAssets++;
                drawLoading();
            }

            else if (loadedAssets >= totalAssets) {
                last = performance.now();
                requestAnimationFrame(loop);

            }

        }



        ///////////////////////////////////////////////////////////////////////
        // 更新
        ///////////////////////////////////////////////////////////////////////
        function update(delta) {

            soundset();

            if (pausef == 0) c += speed * delta;


            /*
            //スティック用　とりあえず使わない
            if ( mainroutine == 0 ){
            //ゲームパッド入力用
            const gp = getGamepad();

            //ゲームパッド無反応の時
            let noInput = true;
            if (gp) {
                for (let b = 0; b < gp.buttons.length; b++) {
                    if (gp.buttons[b].pressed) {
                        noInput = false;
                        mouseDown = false;
                        break;
                    }
                }

                for (let a = 0; a < gp.axes.length; a++) {
                    if (Math.abs(gp.axes[a]) > 0.2) {
                        noInput = false;
                        mouseDown = false;
                        break;
                    }
                }
            }

            }

            */


            /*
            if (inputn == 3 || inputn == 5) {

                inputPadConfig = [12, 15, 13, 14, 0, 1, 3, 2, 4, 9, 8, 5];
                function updateInputKeys() {
                    const gp = getGamepad();
                    inputkeys.up = gp?.buttons?.[inputPadConfig[0]]?.pressed;
                    inputkeys.right = gp?.buttons?.[inputPadConfig[1]]?.pressed;
                    inputkeys.down = gp?.buttons?.[inputPadConfig[2]]?.pressed;
                    inputkeys.left = gp?.buttons?.[inputPadConfig[3]]?.pressed;
                    inputkeys.a = gp?.buttons?.[inputPadConfig[4]]?.pressed;
                    inputkeys.q = gp?.buttons?.[inputPadConfig[5]]?.pressed;
                    inputkeys.w = gp?.buttons?.[inputPadConfig[6]]?.pressed;
                    inputkeys.e = gp?.buttons?.[inputPadConfig[7]]?.pressed;
                    inputkeys.r = gp?.buttons?.[inputPadConfig[8]]?.pressed;
                    inputkeys.pause = gp?.buttons?.[inputPadConfig[9]]?.pressed;
                    inputkeys.config = gp?.buttons?.[inputPadConfig[10]]?.pressed;
                    inputkeys.mute = gp?.buttons?.[inputPadConfig[11]]?.pressed;

                }

                updateInputKeys();

            }
            */

        }


        ///////////////////////////////////////////////////////////////////////
        // ループ
        ///////////////////////////////////////////////////////////////////////
        let last = performance.now();
        resize();
        function loop(now) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            //FPS 60
            const delta = (now - last) / 16.666;
            last = now;
            update(delta);

            if (pausef == 0 && playerdeadf == 0 ) timer += delta / 60;




            ////////////////////////////////////////////////////////////
            // 0 ローディング
            ////////////////////////////////////////////////////////////
            if (mainroutine == 0) {
                drawLoading();

                if (mouseDown) {
                    voicef[0] = 1;
                    oneletterc = oneflame;

                }


               const gp = getGamepad();
                if (gp?.buttons?.[0]?.pressed) {
                    if (spf == 1) inputn = 5;
                    else inputn = 3;
                    gamepadf = 1;
                    mouseDown = true;

                }

                //updateInputKeys();
                if ( click || keys["Space"] || keys["Enter"]) {
                    if (spf == 1 && pcf == 0) inputn = 4;
                    mouseDown = true;

                }

                //ここでmainroutine 1 に移動
                if (mouseDown && loadedAssets >= totalAssets) {
                    c = 0;
                    timer = 0;
                    pressKeyf = false;
                    mouseDown = false;
                    mainroutine = 1;

                }

            }

            ////////////////////////////////////////////////////////////
            // 1 タイトル
            ////////////////////////////////////////////////////////////
            else if (mainroutine == 1) {
                lastroutine = 1;
                drawtop();

            }

            ////////////////////////////////////////////////////////////
            // 2 設定
            ////////////////////////////////////////////////////////////
            else if (mainroutine == 2) {
                pausef = 1;
                configprocess();
                drawconfig();

            }

            ////////////////////////////////////////////////////////////
            // 3 スペシャルサンクス
            ////////////////////////////////////////////////////////////
            else if (mainroutine == 3) {
                drawthanks();

            }

            ////////////////////////////////////////////////////////////
            // 4 ゲーム
            ////////////////////////////////////////////////////////////
            else if (mainroutine == 4) {
                if (mainroutine !== lastroutine && timerf == 0) timer = 0, timerf = 1;
                lastroutine = 4;
                process(delta);
                draw();



            }





            requestAnimationFrame(loop);

        }




    </script>

</body>
</html>
